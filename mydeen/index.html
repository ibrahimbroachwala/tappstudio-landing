            --color-footer: #aaa;

            cursor: pointer;

        .theme-toggle-btn {

<body>

    <script>
        // Theme toggle logic
        const themeBtn = document.getElementById('theme-toggle-btn');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        function setTheme(mode) {
            if (mode === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
                themeBtn.textContent = '🌙';
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
                themeBtn.textContent = '☀️';
            }
        }
        // Check localStorage or use browser default
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme) {
            setTheme(savedTheme);
        } else {
            setTheme(prefersDark ? 'dark' : 'light');
        }
        themeBtn.addEventListener('click', () => {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            setTheme(next);
            localStorage.setItem('theme', next);
        });
        // Animate in
        window.addEventListener('DOMContentLoaded', () => {
            document.querySelector('.app-page-container').style.opacity = 0;
            setTimeout(() => {
                document.querySelector('.app-page-container').style.transition = 'opacity 0.8s';
                document.querySelector('.app-page-container').style.opacity = 1;
            }, 100);
        });
    </script>
