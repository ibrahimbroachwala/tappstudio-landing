<!doctype html><html><head><meta charset="utf-8">
<!-- X (Twitter) profile header, 1500x500. Same design as banner.html option B.
     Render: Chrome --headless=new --window-size=1500,500 --force-device-scale-factor=2 --screenshot=out.png "file://.../x-header.html"
     The avatar covers roughly x 40-380 on the bottom third, and X can trim ~50px top and bottom, so all text sits in y 56-310. -->
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Geist:wght@400;500;600&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1500px;height:500px;background:#0e0e0c;color:#f2efe8;font-family:'Geist',sans-serif;position:relative;overflow:hidden}
.glow-t{position:absolute;left:-200px;top:-500px;width:1000px;height:1000px;background:radial-gradient(circle,rgba(20,184,166,.16),transparent 60%)}
.glow-k{position:absolute;left:760px;top:-200px;width:900px;height:900px;background:radial-gradient(circle,rgba(244,163,0,.18),transparent 60%)}

.wall{position:absolute;left:800px;top:-150px;width:900px;height:900px;display:flex;gap:20px;transform:rotate(-9deg);transform-origin:0 0;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 80px)}
.col{display:flex;flex-direction:column;gap:20px}
.col:nth-child(odd){margin-top:-150px}
.col img{width:172px;height:374px;border-radius:22px;display:block;object-fit:cover;
  border:1.5px solid rgba(255,255,255,.09);box-shadow:0 18px 36px -10px rgba(0,0,0,.8)}
.col img.k{border-color:rgba(244,163,0,.55)}

.txt{position:absolute;left:90px;top:56px;width:760px}
.eyebrow{font-family:'Geist Mono';font-size:16px;letter-spacing:.1em;text-transform:uppercase;color:#14b8a6;display:flex;align-items:center;gap:10px}
.eyebrow i{width:8px;height:8px;border-radius:50%;background:#14b8a6;box-shadow:0 0 0 4px rgba(20,184,166,.18)}
h1{font-family:'Bricolage Grotesque';font-weight:800;font-size:62px;line-height:1;letter-spacing:-2.2px;margin-top:16px}
h1 b{font-weight:800;color:#f4a300}
p{font-size:20px;line-height:1.38;color:#a8a49a;margin-top:14px;max-width:700px}
.foot{display:flex;align-items:center;gap:16px;margin-top:16px}
.icons{display:flex;gap:8px}
.icons img{width:36px;height:36px;border-radius:9px;border:1px solid rgba(255,255,255,.1)}
.url{font-family:'Geist Mono';font-size:15px;color:#9a968c}
</style></head><body>
<div class="glow-t"></div><div class="glow-k"></div>

<div class="wall">
  <div class="col"><img class="k" src="../../public/apps/kadak/2-540.webp"><img class="k" src="../../public/apps/kadak/1-540.webp"><img src="../../public/apps/hunarcircle/1-540.webp"></div>
  <div class="col"><img src="../../public/apps/splitup/2-540.webp"><img src="../../public/apps/splitup/1-540.webp"></div>
  <div class="col"><img src="../../public/apps/mydeen/1-540.webp"><img src="../../public/apps/nasab/2-540.webp"><img src="../../public/apps/nasab/1-540.webp"></div>
  <div class="col"><img src="../../public/apps/misbaha/1-540.webp"><img src="../../public/apps/mydeen/2-540.webp"></div>
</div>

<div class="txt">
  <div class="eyebrow"><i></i>tappStudio · Mumbai</div>
  <h1>From a family tree<br>to a <b>chai tapri.</b></h1>
  <p>Apps for family, friends and faith, and now a game.</p>
  <div class="foot">
    <div class="icons">
      <img src="../../public/apps/kadak/icon-256.webp"><img src="../../public/apps/nasab/icon-256.webp"><img src="../../public/apps/splitup/icon-256.webp"><img src="../../public/apps/mydeen/icon-256.webp"><img src="../../public/apps/misbaha/icon-256.webp"><img src="../../public/apps/hunarcircle/icon-256.webp">
    </div>
    <div class="url">tappstudio.in</div>
  </div>
</div>
</body></html>
