<!doctype html><html><head><meta charset="utf-8">
<!-- LinkedIn company page cover (tappStudio page), 1512x256 (same ratio as LinkedIn's 1128x191).
     Render: Chrome --headless=new --window-size=1512,256 --force-device-scale-factor=2 --screenshot=out.png "file://.../cover.html"
     The page logo sits over the bottom-left, so text starts at x 330. -->
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Geist:wght@400;500;600&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1512px;height:256px;background:#0e0e0c;color:#f2efe8;font-family:'Geist',sans-serif;position:relative;overflow:hidden}
.glow-t{position:absolute;left:140px;top:-420px;width:800px;height:800px;background:radial-gradient(circle,rgba(20,184,166,.16),transparent 60%)}
.glow-k{position:absolute;left:960px;top:-260px;width:700px;height:700px;background:radial-gradient(circle,rgba(244,163,0,.18),transparent 60%)}

.wall{position:absolute;left:1110px;top:-110px;width:700px;height:560px;display:flex;gap:14px;transform:rotate(-9deg);transform-origin:0 0;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 70px)}
.col{display:flex;flex-direction:column;gap:14px}
.col:nth-child(odd){margin-top:-100px}
.col img{width:112px;height:243px;border-radius:15px;display:block;object-fit:cover;
  border:1.5px solid rgba(255,255,255,.09);box-shadow:0 14px 28px -8px rgba(0,0,0,.8)}
.col img.k{border-color:rgba(244,163,0,.55)}

.txt{position:absolute;left:330px;top:52px}
.eyebrow{font-family:'Geist Mono';font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:#14b8a6;display:flex;align-items:center;gap:10px}
.eyebrow i{width:7px;height:7px;border-radius:50%;background:#14b8a6;box-shadow:0 0 0 4px rgba(20,184,166,.18)}
h1{font-family:'Bricolage Grotesque';font-weight:800;font-size:48px;line-height:1;letter-spacing:-1.6px;margin-top:12px;white-space:nowrap}
h1 b{font-weight:800;color:#f4a300}
.foot{display:flex;align-items:center;gap:16px;margin-top:20px}
.icons{display:flex;gap:7px}
.icons img{width:32px;height:32px;border-radius:8px;border:1px solid rgba(255,255,255,.1)}
.sub{font-size:15px;color:#a8a49a}
.url{font-family:'Geist Mono';font-size:14px;color:#9a968c}
</style></head><body>
<div class="glow-t"></div><div class="glow-k"></div>

<div class="wall">
  <div class="col"><img class="k" src="../../public/apps/kadak/2-540.webp"><img class="k" src="../../public/apps/kadak/1-540.webp"><img src="../../public/apps/hunarcircle/1-540.webp"></div>
  <div class="col"><img src="../../public/apps/splitup/2-540.webp"><img src="../../public/apps/splitup/1-540.webp"></div>
  <div class="col"><img src="../../public/apps/mydeen/1-540.webp"><img src="../../public/apps/nasab/2-540.webp"><img src="../../public/apps/nasab/1-540.webp"></div>
  <div class="col"><img src="../../public/apps/misbaha/1-540.webp"><img src="../../public/apps/mydeen/2-540.webp"></div>
</div>

<div class="txt">
  <div class="eyebrow"><i></i>Independent app studio · Mumbai</div>
  <h1>From a family tree to a <b>chai tapri.</b></h1>
  <div class="foot">
    <div class="icons">
      <img src="../../public/apps/kadak/icon-256.webp"><img src="../../public/apps/nasab/icon-256.webp"><img src="../../public/apps/splitup/icon-256.webp"><img src="../../public/apps/mydeen/icon-256.webp"><img src="../../public/apps/misbaha/icon-256.webp"><img src="../../public/apps/hunarcircle/icon-256.webp">
    </div>
    <div class="sub">Apps for family, friends and faith, and now a game.</div>
    <div class="url">tappstudio.in</div>
  </div>
</div>
</body></html>
