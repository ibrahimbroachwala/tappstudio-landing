<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>tappStudio Socials</title>
<link rel="icon" href="../favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --ink:#0e0e0c; --ink-2:#181814; --ink-3:#24231e; --cream:#f2efe8; --muted:#9a968c; --teal:#14b8a6; --soft:rgba(20,184,166,.14); --line:rgba(242,239,232,.1); --amber:#f5b14c; --ig:#f472b6; --li:#5aa9ff; --x:#f2efe8; --bar:56px; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--ink); color: var(--cream); font-family: 'Geist', sans-serif; }
  body { min-height: 100vh; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .cur { display: inline-block; width: .42em; height: .8em; background: var(--teal); border-radius: 2px; margin-left: .08em; vertical-align: -.05em; }
  .t { color: var(--teal); }

  /* Lock screen */
  #lock { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
  .lockbox { width: min(380px, 100%); }
  .lockbox .crumb { font: 500 12px 'Geist Mono', monospace; color: var(--muted); }
  .lockbox h1 { font: 800 40px/1 'Bricolage Grotesque', sans-serif; letter-spacing: -1.4px; margin: 10px 0 22px; }
  .lockbox input[type=password] { width: 100%; padding: 13px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--ink-2); font: 500 15px 'Geist Mono', monospace; outline: none; }
  .lockbox input[type=password]:focus { border-color: var(--teal); }
  .lockbox label { display: flex; gap: 8px; align-items: center; margin-top: 12px; font-size: 13px; color: var(--muted); }
  .lockbox .go { margin-top: 16px; width: 100%; padding: 13px; border: 0; border-radius: 10px; background: var(--teal); color: var(--ink); font: 600 14px 'Geist Mono', monospace; }
  .lockbox .go:disabled { opacity: .6; cursor: wait; }
  .lockbox .err { margin-top: 12px; min-height: 18px; font-size: 13px; color: var(--amber); }

  /* App */
  #app { display: none; }
  .bar { position: sticky; top: 0; z-index: 10; height: var(--bar); display: flex; align-items: center; gap: 12px; padding: 0 16px; background: var(--ink-2); border-bottom: 1px solid var(--line); }
  .logo { font: 800 20px 'Bricolage Grotesque', sans-serif; letter-spacing: -.5px; }
  .logo i { font-style: normal; color: var(--teal); } .logo span { color: var(--muted); }
  .tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; flex: 1; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 9px; border: 1px solid transparent; background: none; font: 500 13px 'Geist Mono', monospace; color: var(--muted); white-space: nowrap; }
  .tab:hover { color: var(--cream); background: var(--ink-3); }
  .tab[aria-selected="true"] { color: var(--cream); background: var(--ink-3); border-color: var(--line); }
  .chip .dot { width: 8px; height: 8px; border-radius: 50%; }
  .tab .dot { width: 8px; height: 8px; border-radius: 50%; }
  .tab .n { font-size: 11px; padding: 1px 6px; border-radius: 999px; background: var(--ink); color: var(--muted); }
  .tab .n.hot { background: var(--amber); color: var(--ink); }
  .barbtn { font: 500 12px 'Geist Mono', monospace; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: none; color: var(--muted); white-space: nowrap; }
  .barbtn:hover { color: var(--cream); border-color: var(--cream); }

  main { max-width: 1180px; margin: 0 auto; padding: 26px 16px 70px; }
  .crumb { font: 500 12px 'Geist Mono', monospace; color: var(--muted); }
  .crumb b { color: var(--cream); font-weight: 500; }
  h1.big { font: 800 clamp(30px, 5vw, 48px)/1 'Bricolage Grotesque', sans-serif; letter-spacing: -1.8px; margin-top: 10px; }
  .stats { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
  .stat { background: var(--ink-2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; min-width: 110px; }
  .stat b { display: block; font: 800 26px/1 'Bricolage Grotesque', sans-serif; }
  .stat span { font: 500 11px 'Geist Mono', monospace; color: var(--muted); }
  .stat.hot b { color: var(--amber); }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; align-items: center; }
  .chip { display: inline-flex; align-items: center; gap: 6px; font: 500 12px 'Geist Mono', monospace; background: var(--ink-2); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; color: var(--muted); }
  .chip.on { color: var(--cream); border-color: var(--cream); }
  .sep { width: 1px; height: 22px; background: var(--line); margin: 0 4px; }
  .sync { font: 500 11px 'Geist Mono', monospace; color: var(--muted); margin-top: 10px; }

  section.group { margin-top: 26px; }
  section.group h2 { font: 500 11px 'Geist Mono', monospace; letter-spacing: .12em; text-transform: uppercase; color: var(--teal); margin-bottom: 8px; display: flex; gap: 8px; }
  section.group h2.hot { color: var(--amber); }
  section.group h2 span { color: var(--muted); }
  details > summary { cursor: pointer; list-style: none; }
  details > summary::-webkit-details-marker { display: none; }
  .row { display: grid; grid-template-columns: 96px 78px 96px 30px 52px minmax(0, 1fr) 92px auto; gap: 10px; align-items: center; padding: 10px 12px; background: var(--ink-2); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 6px; font-size: 13.5px; }
  .row.open { border-color: rgba(20,184,166,.5); }
  .m { font: 500 11.5px 'Geist Mono', monospace; color: var(--muted); }
  .brand { display: inline-flex; align-items: center; gap: 6px; font: 600 11.5px 'Geist Mono', monospace; }
  .brand i { width: 8px; height: 8px; border-radius: 2px; }
  .pf { font: 600 10.5px 'Geist Mono', monospace; text-align: center; padding: 2px 0; border-radius: 4px; background: var(--cream); color: var(--ink); }
  .pf { text-decoration: none; } a.pf:hover { filter: brightness(1.15); outline: 1px solid var(--cream); }
  .pf.IG { background: var(--ig); } .pf.LI { background: var(--li); } .pf.X { background: var(--x); }
  .ttl { background: none; border: 0; text-align: left; color: var(--cream); line-height: 1.35; }
  .ttl:hover { color: var(--teal); }
  .ttl small { display: block; color: var(--amber); font-size: 11.5px; margin-top: 3px; }
  .st { font: 600 10.5px 'Geist Mono', monospace; text-transform: uppercase; letter-spacing: .06em; padding: 3px 7px; border-radius: 5px; text-align: center; background: var(--ink-3); color: var(--muted); }
  .st.ready { background: var(--soft); color: var(--teal); }
  .st.scheduled { background: rgba(245,177,76,.15); color: var(--amber); }
  .st.posted { background: var(--teal); color: var(--ink); }
  .acts { display: flex; gap: 6px; justify-content: flex-end; }
  .acts button { font: 600 11px 'Geist Mono', monospace; padding: 6px 9px; border-radius: 6px; border: 1px solid var(--line); background: var(--ink); }
  .acts button:hover { border-color: var(--teal); color: var(--teal); }
  .acts button:disabled { opacity: .5; cursor: wait; }
  .more { grid-column: 1 / -1; display: flex; gap: 14px; align-items: flex-start; }
  .thumbs { display: flex; gap: 6px; flex: none; }
  .thumbs img { width: 54px; height: 68px; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); background: var(--ink); display: block; }
  .thumbs .plus { width: 54px; height: 68px; border-radius: 6px; border: 1px dashed var(--line); display: grid; place-items: center; font: 600 12px 'Geist Mono', monospace; color: var(--muted); }
  .prev { flex: 1; min-width: 0; background: none; border: 0; text-align: left; color: var(--muted); font-size: 13px; line-height: 1.5; white-space: pre-line;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .row.open .more { flex-direction: column; }
  .row.open .thumbs { flex-wrap: wrap; gap: 8px; }
  .row.open .thumbs img { width: 168px; height: 210px; cursor: zoom-in; }
  .row.open .prev { display: block; -webkit-line-clamp: unset; overflow: visible; white-space: pre-wrap; color: var(--cream); font-size: 14px; background: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; width: 100%; cursor: text; user-select: text; }
  .tools { display: none; gap: 8px; flex-wrap: wrap; align-items: center; }
  .row.open .tools { display: flex; }
  .tools button { font: 600 11.5px 'Geist Mono', monospace; padding: 7px 11px; border-radius: 7px; border: 0; background: var(--teal); color: var(--ink); }
  .tools .meta { font: 500 11px 'Geist Mono', monospace; color: var(--muted); }
  .empty { color: var(--muted); font-size: 13px; padding: 6px 2px; }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--cream); color: var(--ink); padding: 10px 14px; border-radius: 10px; font-size: 13px; font-weight: 500; display: none; z-index: 20; max-width: calc(100vw - 32px); }
  .viewer { position: fixed; inset: 0; background: rgba(0,0,0,.88); display: none; place-items: center; z-index: 30; padding: 16px; }
  .viewer { grid-template-rows: 1fr auto; gap: 12px; }
  .viewer img { max-width: 100%; max-height: calc(100vh - 90px); border-radius: 8px; justify-self: center; align-self: center; }
  .viewer a { justify-self: center; font: 600 12px 'Geist Mono', monospace; padding: 9px 14px; border-radius: 8px; background: var(--teal); color: var(--ink); text-decoration: none; }
  .tools a { font: 600 11.5px 'Geist Mono', monospace; padding: 7px 11px; border-radius: 7px; border: 1px solid var(--line); color: var(--cream); text-decoration: none; }
  .tools button.ghost { background: transparent; color: var(--cream); border: 1px solid var(--line); }

  @media (max-width: 860px) {
    .barbtn.hide-sm { display: none; }
    .row { grid-template-columns: auto auto 30px 1fr; grid-template-areas: "date brand pf st" "ttl ttl ttl ttl" "more more more more" "acts acts acts acts"; }
    .row .d { grid-area: date; } .row .brand { grid-area: brand; } .row .pf { grid-area: pf; } .row .st { grid-area: st; justify-self: end; }
    .row .ttl { grid-area: ttl; } .row .more { grid-area: more; flex-direction: column; } .row .acts { grid-area: acts; justify-content: flex-start; }
    .row .tm, .row .id { display: none; }
    .row.open .thumbs img { width: calc(50% - 4px); height: auto; aspect-ratio: 4 / 5; }
  }
</style>
</head>

<div id="lock">

    <div class="crumb">~/tappstudio/<b>socials</b></div>
    <h1>Locked<span class="cur"></span></h1>
    <input type="password" id="pw" placeholder="Password" autocomplete="current-password" autofocus>

    <div class="stats" id="stats"></div>
    <div class="filters" id="filters"></div>
    <div class="sync" id="sync"></div>
    <div id="groups"></div>
  </main>
</div>
<div class="toast" id="toast"></div>

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

let DATA = null, BOARD = null, BR = {};
let tab = 'all', plat = 'all', hidePosted = true;

/* ---------- unlock ---------- */
async function unlockWithBits(bits) {
  const key = await crypto.subtle.importKey('raw', bits.slice(0, 32), 'AES-GCM', false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(VAULT.iv) }, key, b64(VAULT.ct));
  DATA = JSON.parse(new TextDecoder().decode(plain));
  BOARD = hex(await crypto.subtle.digest('SHA-256', bits.slice(32, 64))).slice(0, 40);
  BR = Object.fromEntries(DATA.brands.map(b => [b.key, b]));
  document.getElementById('lock').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  tab = store(localStorage, 'socials:tab') || 'all';
  render();
  loadStatus();
}
async function derive(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: fromHex(VAULT.salt), iterations: VAULT.iterations }, base, 512));
}
document.getElementById('lockform').onsubmit = async e => {
  e.preventDefault();
  const btn = document.getElementById('go'), err = document.getElementById('err');
  btn.disabled = true; btn.textContent = 'Unlocking…'; err.textContent = '';
  try {
    const bits = await derive(document.getElementById('pw').value);
    await unlockWithBits(bits);
    const saved = hex(bits);
    store(sessionStorage, 'socials:bits', saved);
    if (document.getElementById('remember').checked) store(localStorage, 'socials:bits', saved);
    document.getElementById('pw').value = '';
  } catch (x) {
    err.textContent = 'Wrong password.';
  } finally { btn.disabled = false; btn.textContent = 'Unlock'; }
};
document.getElementById('lockbtn').onclick = () => {
  store(sessionStorage, 'socials:bits', null); store(localStorage, 'socials:bits', null); location.reload();
};
(async () => {
  const saved = store(sessionStorage, 'socials:bits') || store(localStorage, 'socials:bits');
  if (saved) { try { await unlockWithBits(fromHex(saved)); } catch (e) { store(sessionStorage, 'socials:bits', null); store(localStorage, 'socials:bits', null); } }
})();

/* ---------- Firestore (REST, no SDK) ---------- */
const docUrl = id => `${VAULT.fs}/boards/${BOARD}/status/${encodeURIComponent(id)}?key=${VAULT.key}`;
async function loadStatus() {
  const sync = document.getElementById('sync');
  sync.textContent = 'Loading live statuses…';
  try {
    let token = '', n = 0;
    do {
      const r = await fetch(`${VAULT.fs}/boards/${BOARD}/status?key=${VAULT.key}&pageSize=300${token ? '&pageToken=' + token : ''}`);
      if (!r.ok) throw new Error(r.status);
      const j = await r.json();
      (j.documents || []).forEach(d => {
        const f = Object.fromEntries(Object.entries(d.fields || {}).map(([k, v]) => [k, Object.values(v)[0]]));
        const p = DATA.posts.find(x => x.brand === f.brand && x.id === f.id);
        if (p && f.status) { p.status = f.status; p.posted = f.posted || ''; n++; }
      });
      token = j.nextPageToken || '';
    } while (token);
    sync.textContent = `Live · ${n} statuses synced · page built ${DATA.built}`;
    render();
  } catch (e) {
    sync.textContent = `Offline copy from ${DATA.built}. Status changes need a connection.`;
  }
}
async function setStatus(brand, id, status, btn) {
  const p = DATA.posts.find(x => x.brand === brand && x.id === id);
  const posted = status === 'posted' ? new Date().toISOString().slice(0, 10) : '';
  const fields = { brand: { stringValue: brand }, id: { stringValue: id }, status: { stringValue: status },
                   posted: { stringValue: posted }, updated: { timestampValue: new Date().toISOString() } };
  if (btn) btn.disabled = true;
  try {
    const r = await fetch(docUrl(brand + '__' + id), { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ fields }) });
    if (!r.ok) throw new Error(r.status);
    p.status = status; p.posted = posted;
    render(); toast(`${BR[brand].label} ${id} marked ${status}.`);
  } catch (e) { toast('Could not save. Check your connection and try again.'); if (btn) btn.disabled = false; }
}

/* ---------- UI ---------- */
const pad = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = iso(new Date());
const plus = n => { const d = new Date(); d.setDate(d.getDate() + n); return iso(d); };
const label = s => new Date(s + 'T00:00').toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
const open = p => p.status !== 'posted';
function toast(m) { const t = document.getElementById('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = 'none', 3000); }

function render() {
  const nav = document.getElementById('tabs'); nav.innerHTML = '';
  [{ key: 'all', label: 'All brands' }, ...DATA.brands].forEach(t => {
    const b = document.createElement('button'); b.className = 'tab'; b.setAttribute('role', 'tab'); b.setAttribute('aria-selected', t.key === tab);
    const mine = DATA.posts.filter(p => t.key === 'all' || p.brand === t.key);
    const late = mine.filter(p => open(p) && p.date < today).length, due = mine.filter(p => open(p) && p.date <= plus(7)).length;
    b.innerHTML = (t.accent ? `<span class="dot" style="background:${t.accent}"></span>` : '') + esc(t.label) +
      (late ? `<span class="n hot">${late} late</span>` : due ? `<span class="n">${due}</span>` : '');
    b.onclick = () => { tab = t.key; store(localStorage, 'socials:tab', tab); render(); };
    nav.appendChild(b);
  });
  document.getElementById('headline').innerHTML = tab === 'all' ? 'Every brand. <span class="t">One calendar.</span><span class="cur"></span>'
    : `${esc(BR[tab].label)}, <span class="t">on schedule.</span><span class="cur"></span>`;

  const ps = DATA.posts.filter(p => (tab === 'all' || p.brand === tab) && (plat === 'all' || p.platform === plat));
  const late = ps.filter(p => open(p) && p.date < today), tod = ps.filter(p => open(p) && p.date === today),
        week = ps.filter(p => open(p) && p.date > today && p.date <= plus(7)), later = ps.filter(p => open(p) && p.date > plus(7)),
        done = ps.filter(p => !open(p));
  document.getElementById('stats').innerHTML = [['Late', late.length, late.length ? 'hot' : ''], ['Today', tod.length], ['Next 7 days', week.length],
    ['Ready', ps.filter(p => p.status === 'ready').length], ['Scheduled', ps.filter(p => p.status === 'scheduled').length], ['Posted', done.length]]
    .map(([l, n, c]) => `<div class="stat ${c || ''}"><b>${n}</b><span>${l}</span></div>`).join('');

  const f = document.getElementById('filters'); f.innerHTML = '';
  const chip = (html, on, fn) => { const b = document.createElement('button'); b.className = 'chip' + (on ? ' on' : ''); b.innerHTML = html; b.onclick = fn; f.appendChild(b); };
  [['all', 'All'], ['IG', 'Instagram'], ['LI', 'LinkedIn'], ['X', 'X']].forEach(([v, l]) => chip((v === 'all' ? '' : `<span class="dot" style="background:var(--${v.toLowerCase()})"></span>`) + l, plat === v, () => { plat = v; render(); }));
  f.appendChild(Object.assign(document.createElement('span'), { className: 'sep' }));
  chip(hidePosted ? 'Posted hidden' : 'Showing posted', !hidePosted, () => { hidePosted = !hidePosted; render(); });

  const g = document.getElementById('groups'); g.innerHTML = '';
  const group = (title, list, o = {}) => {
    const s = document.createElement('section'); s.className = 'group';
    const head = `<h2 class="${o.hot ? 'hot' : ''}">${title} <span>${list.length}</span></h2>`;
    const body = list.length ? list.map(row).join('') : `<div class="empty">${o.empty || 'Nothing here.'}</div>`;
    s.innerHTML = o.fold ? `<details${o.open ? ' open' : ''}><summary>${head}</summary>${body}</details>` : head + body;
    g.appendChild(s);
  };
  if (late.length) group('Late, not posted yet', late, { hot: true });
  group('Today · ' + label(today), tod, { empty: 'Nothing scheduled today.' });
  group('Next 7 days', week);
  group('Later', later, { fold: true, open: tab !== 'all' });
  if (!hidePosted) group('Posted', done.slice().reverse(), { fold: true, open: true });

  g.querySelectorAll('[data-toggle]').forEach(b => b.onclick = () => {
    if (getSelection().toString()) return;
    const k = b.dataset.toggle; opened.has(k) ? opened.delete(k) : opened.add(k);
    const y = scrollY; render(); scrollTo(0, y);
  });
  g.querySelectorAll('[data-set]').forEach(b => b.onclick = () => setStatus(b.dataset.brand, b.dataset.id, b.dataset.set, b));
  g.querySelectorAll('[data-copy]').forEach(b => b.onclick = () => {
    const p = DATA.posts.find(x => x.brand + '/' + x.id === b.dataset.copy);
    navigator.clipboard.writeText(p.text).then(() => { b.textContent = 'Copied'; setTimeout(() => b.textContent = 'Copy post', 1500); });
  });
  g.querySelectorAll('.row.open .thumbs img').forEach(i => i.onclick = () => {
    const v = document.getElementById('viewer'); v.querySelector('img').src = i.dataset.full;
    const a = document.getElementById('viewerdl');
    a.onclick = ev => { ev.preventDefault(); saveFiles([[i.dataset.full, null, i.dataset.name]], a); };
    v.style.display = 'grid';
  });
  g.querySelectorAll('[data-pdf]').forEach(b => b.onclick = () => makePdf(DATA.posts.find(x => x.brand + '/' + x.id === b.dataset.pdf), b));
  g.querySelectorAll('[data-save]').forEach(b => b.onclick = () => saveFiles(DATA.posts.find(x => x.brand + '/' + x.id === b.dataset.save).images, b));
}
document.getElementById('viewer').onclick = e => { if (e.target.tagName !== 'A') e.currentTarget.style.display = 'none'; };

/* Nothing full-size is stored online. On Save, the 1080px WebP is turned into a full-size JPEG in the browser.
   On phones that opens the share sheet (Save to Photos, or straight into Instagram / LinkedIn / X); elsewhere it downloads. */
async function toJpeg(url, name) {
  const r = await fetch(url); if (!r.ok) throw new Error(r.status);
  const bmp = await createImageBitmap(await r.blob());
  const c = Object.assign(document.createElement('canvas'), { width: bmp.width, height: bmp.height });
  const ctx = c.getContext('2d'); ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(bmp, 0, 0);
  const blob = await new Promise(res => c.toBlob(res, 'image/jpeg', 0.95));
  return new File([blob], name, { type: 'image/jpeg' });
}
async function busy(btn, fn) {
  const label = btn.textContent; btn.disabled = true; btn.textContent = 'Preparing…';
  try { await fn(); } catch (e) { if (e.name !== 'AbortError') toast('Could not prepare the files. Try again.'); }
  finally { btn.disabled = false; btn.textContent = label; }
}
function download(file) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = file.name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
function saveFiles(images, btn) {
  return busy(btn, async () => {
    const files = await Promise.all(images.map(([full, , name]) => toJpeg(full, name)));
    if (matchMedia('(pointer: coarse)').matches && navigator.canShare && navigator.canShare({ files })) await navigator.share({ files });
    else files.forEach((f, i) => setTimeout(() => download(f), i * 350));
  });
}
function loadJsPdf() {
  return window.jspdf ? Promise.resolve() : new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
    s.onload = res; s.onerror = rej; document.head.appendChild(s);
  });
}
function makePdf(p, btn) {
  return busy(btn, async () => {
    await loadJsPdf();
    const files = await Promise.all(p.images.map(([full, , name]) => toJpeg(full, name)));
    let doc = null;
    for (const f of files) {
      const bmp = await createImageBitmap(f), w = bmp.width, h = bmp.height;
      const data = await new Promise(res => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.readAsDataURL(f); });
      if (!doc) doc = new window.jspdf.jsPDF({ unit: 'px', format: [w, h], orientation: h >= w ? 'portrait' : 'landscape', hotfixes: ['px_scaling'] });
      else doc.addPage([w, h], h >= w ? 'portrait' : 'landscape');
      doc.addImage(data, 'JPEG', 0, 0, w, h);
    }
    const file = new File([doc.output('blob')], `${p.brand}-${p.id}-carousel.pdf`, { type: 'application/pdf' });
    if (matchMedia('(pointer: coarse)').matches && navigator.canShare && navigator.canShare({ files: [file] })) await navigator.share({ files: [file] });
    else download(file);
  });
}
document.getElementById('refresh').onclick = () => loadStatus();

function row(p) {
  const b = BR[p.brand], k = p.brand + '/' + p.id, isOpen = opened.has(k);
  const btn = (s, l) => `<button data-brand="${p.brand}" data-id="${esc(p.id)}" data-set="${s}">${l}</button>`;
  const acts = p.status === 'posted' ? btn('ready', 'Undo')
    : (p.status === 'scheduled' ? btn('ready', 'Unschedule') : btn('scheduled', 'Scheduled')) + btn('posted', 'Posted');
  const imgs = p.images || [];
  return `<div class="row${isOpen ? ' open' : ''}">
    <span class="m d">${label(p.date)}</span><span class="m tm">${esc(p.time)}</span>
    <span class="brand"><i style="background:${b.accent}"></i>${esc(b.label)}</span>
    ${pf(p)}<span class="m id">${esc(p.id)}</span>
    <button class="ttl" data-toggle="${esc(k)}">${esc(p.title)}${p.warn && open(p) ? `<small>⚠️ ${esc(p.note).slice(0, 140)}</small>` : ''}</button>
    <span class="st ${esc(p.status)}">${esc(p.status)}</span><span class="acts">${acts}</span>
    <div class="more">
      ${imgs.length ? `<div class="thumbs">${imgs.slice(0, isOpen ? 99 : 4).map(([full, th, name]) => `<img loading="lazy" src="${isOpen ? full : th}" data-full="${full}" data-name="${esc(name)}" alt="">`).join('')}${!isOpen && imgs.length > 4 ? `<span class="plus">+${imgs.length - 4}</span>` : ''}</div>` : ''}
      <button class="prev" data-toggle="${esc(k)}">${esc(p.text)}</button>
      <div class="tools"><button data-copy="${esc(k)}">Copy post</button>
        ${imgs.length ? `<button class="ghost" data-save="${esc(k)}">Save ${imgs.length > 1 ? imgs.length + ' images' : 'image'}</button>` : ''}
        ${p.carousel && imgs.length > 1 ? `<button class="ghost" data-pdf="${esc(k)}">Make PDF</button>` : ''}
        <span class="meta">${esc(p.format)} · ${imgs.length ? imgs.length + ' image' + (imgs.length > 1 ? 's' : '') : 'no images yet'}${p.posted ? ' · posted ' + esc(p.posted) : ''}</span></div>
    </div></div>`;
}
</script>
